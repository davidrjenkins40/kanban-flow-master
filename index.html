        dragOffsetY: 0,

        ai: { x: 200, y: 240, state: "idle", targetCard: null, targetCol: -1, waitTimer: 0.4 }
      };

      function getDayCfg() { return DAY_CONFIGS[Math.min(State.dayIndex, DAY_CONFIGS.length - 1)]; }

      function loadHighScore() {
        try {
          const v = parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10);
          if (!isNaN(v) && v > 0) State.highScore = v;
        } catch (_) {}
      }

      function saveHighScore() {
        if (State.score > State.highScore) {
          State.highScore = State.score;
          try { localStorage.setItem(HIGH_SCORE_KEY, String(State.highScore)); } catch (_) {}
        }
      }

      /* ============================================================
         6. COORDINATES, SLOTS, FX & AVATAR HELPERS
         ============================================================ */
      function colX(colIdx) { return COL_START_X + colIdx * (COL_W + COL_GAP); }

      function getCardsInColumn(colIdx, excludeCard = null) {
        return State.cards
          .filter(c => c.col === colIdx && c !== excludeCard)
          .sort((a, b) => a.slotOrder - b.slotOrder);
      }

      function cardSlotPos(colIdx, indexInCol) {
        const x = colX(colIdx) + Math.floor((COL_W - CARD_W) / 2);
        const topStart = BOARD_TOP + 42;
        const count = Math.max(1, getCardsInColumn(colIdx).length);
        const availH = BOARD_BOTTOM - topStart - 10;
        const step = count * (CARD_H + CARD_GAP) > availH
          ? Math.max(34, Math.floor((availH - CARD_H) / Math.max(1, count - 1)))
          : (CARD_H + CARD_GAP);
        return { x, y: topStart + indexInCol * step };
      }

      function addPopup(x, y, text, color = PAL.ink, scale = 1) {
        State.popups.push({ x, y, text, color, scale, vy: -38, life: 1.05, maxLife: 1.05 });
      }

      function spawnConfetti(x, y, count = 36) {
        const colors = [PAL.cyan, PAL.coral, PAL.mint, PAL.amber, PAL.violet, PAL.cyanHi, PAL.amberHi];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 75 + Math.random() * 230;
          const isStar = i % 5 === 0;
          State.particles.push({
            kind: isStar ? "star" : "ribbon",
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 95,
            size: isStar ? 5 : (5 + Math.floor(Math.random() * 4)),
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 14,
            life: 0.75 + Math.random() * 0.65,
            maxLife: 1.4
          });
        }
      }

      function spawnSteam(x, y, hot = false) {
        State.particles.push({
          kind: hot && Math.random() < 0.35 ? "spark" : "steam",
          x: x + (Math.random() - 0.5) * 52,
          y,
          vx: (Math.random() - 0.5) * 20,
          vy: -28 - Math.random() * 22,
          size: 4 + Math.floor(Math.random() * 4),
          color: hot ? PAL.amberHi : PAL.coral,
          life: 0.55,
          maxLife: 0.55
        });
      }

      function showStakeholder(kind, name, line1, line2, duration = 5.5) {
        State.stakeholder = { active: true, kind, name, line1, line2, timer: duration, popAnim: 1.0 };
      }

      function showBanner(title, sub, color = PAL.cyan, duration = 2.4) {
        State.banner = { active: true, title, sub, color, timer: duration, duration };
      }

      function cycleAvatar(playSound = true) {
        State.avatar.prevIndex = State.avatar.index;
        State.avatar.index = (State.avatar.index + 1) % AVATAR_ROSTER.length;
        State.avatar.rotateTimer = State.avatar.rotateInterval;
        State.avatar.wipeTimer = State.avatar.wipeDuration;
        if (playSound) {
          AudioEngine.sfxAvatarSwap();
          Haptics.trigger("small");
        }
      }

      /* ============================================================
         7. CARD CREATION, DAY SETUP & KANBAN FLOW LOGIC
         ============================================================ */
      function spawnCard(type = "regular") {
        const newCards = getCardsInColumn(0);
        if (newCards.length >= 8 && type !== "supplier") return null;

        const cfg = getDayCfg();
        const reg = REGULAR_ITEMS[Math.floor(Math.random() * REGULAR_ITEMS.length)];
        let title = reg.title;
        let icon = reg.icon;
        let stripe = reg.stripe;
        let baseWorkTime = cfg.baseWork + Math.random() * 1.1;
        let value = 100;
        let cyberTimer = 0, cyberMax = 0;

        if (type === "blocker") {
          title = BLOCKER_TITLES[Math.floor(Math.random() * BLOCKER_TITLES.length)];
          icon = "blocker";
          stripe = PAL.amber;
          baseWorkTime = cfg.baseWork + 0.65;
          value = 160;
        } else if (type === "pet") {
          title = PET_TITLES[Math.floor(Math.random() * PET_TITLES.length)];
          icon = "crown";
          stripe = PAL.violet;
          baseWorkTime = cfg.baseWork;
          value = 140;
        } else if (type === "cyber") {
          title = CYBER_TITLES[Math.floor(Math.random() * CYBER_TITLES.length)];
          icon = "siren";
          stripe = PAL.crimson;
          baseWorkTime = 2.5;
          value = 400;
          cyberMax = Math.max(28, 38 - State.dayIndex * 2);
          cyberTimer = cyberMax;
        } else if (type === "supplier") {
          title = SUPPLIER_TITLES[Math.floor(Math.random() * SUPPLIER_TITLES.length)];
          icon = "supplier";
          stripe = PAL.coral;
          baseWorkTime = 2.6;
          value = 500;
        }

        const slotPos = cardSlotPos(0, newCards.length);
        const card = {
          id: cardUid++,
          type, title, icon, stripe,
          col: 0,
          slotOrder: Date.now() + cardUid,
          x: slotPos.x - 36,
          y: slotPos.y,
          scaleX: 1.14, scaleY: 0.86,
          progress: 0,
          workDuration: Math.max(1.9, baseWorkTime),
          ready: true,
          readyDinged: true,
          waitAfterReady: 0,
          boilLevel: 0,
          boilPenaltyTimer: 0,
          boilSteamTimer: 0,
          shakeTimer: 0,
          value, cyberTimer, cyberMax
        };

        State.cards.push(card);
        if (type === "blocker") AudioEngine.sfxBlockerWarn();
        return card;
      }

      function setupDay(dayIdx, isRetry = false) {
        State.dayIndex = dayIdx;
        State.dayDelivered = 0;
        State.cards = [];
        State.doneGhosts = [];
        State.colModifiers = {};
        State.draggedCard = null;
        State.bottleneckCritical = false;
        State.bottleneckDrainTimer = 0;
        State.boss.active = false;
        State.boss.hp = State.boss.maxHp;
        State.boss.hitFlash = 0;
        State.boss.attackTimer = 7.5;
        State.boss.spawnTimer = 2.0;
        State.boss.heatWaveTimer = 0;

        const cfg = getDayCfg();
        State.spawnTimer = 1.6;
        State.disruptionTimer = cfg.disruptionRate * 0.7;
        State.cyberTimer = cfg.cyberRate;

        if (isRetry) {
          State.morale = State.maxMorale;
          State.flowStreak = 1;
          State.mode = "playing";
        }

        spawnCard("regular");
        spawnCard("regular");
        const starter = spawnCard("regular");
        if (starter) {
          starter.col = 1;
          starter.ready = false;
          starter.readyDinged = false;
          starter.progress = 0.45;
          const pos = cardSlotPos(1, 0);
          starter.x = pos.x;
          starter.y = pos.y;
        }

        showBanner(`DAY ${cfg.day}/5 — ${cfg.title}`, cfg.subtitle, cfg.isBossDay ? PAL.coral : PAL.cyan, 2.5);

        if (cfg.day === 1) showStakeholder("leader", "TEAM LEAD", "STEADY MONDAY!", "PULL READY CARDS ->", 4.5);
        else if (cfg.day === 2) showStakeholder("manager", "SR. MANAGER", "NEW POLICIES!", "WATCH BLOCKERS!", 4.5);
        else if (cfg.day === 3) showStakeholder("overworked", "TEAM MEMBER", "MIDWEEK CRUNCH!", "KEEP WIP LOW!", 4.5);
        else if (cfg.day === 4) showStakeholder("cyber", "SEC OPS", "HIGH ALERTS!", "CLEAR INCIDENTS!", 4.5);
        else if (cfg.day === 5) showStakeholder("leader", "TEAM LEAD", "FRIDAY WARM-UP!", "3 CARDS TO START...", 4.5);
      }

      function resetWeek(keepAttract = false) {
        State.score = 0;
        State.totalDelivered = 0;
        State.morale = State.maxMorale;
        State.flowStreak = 1;
        State.maxStreakReached = 1;
        State.boilPenaltiesTaken = 0;
        State.mode = "playing";
        State.endScreenIdleTimer = 0;
        State.particles = [];
        State.popups = [];
        State.hitStop = 0;
        State.screenShake = 0;
        State.ai = { x: 180, y: 240, state: "idle", targetCard: null, targetCol: -1, waitTimer: 0.4 };
        State.attractMode = keepAttract;
        if (!keepAttract) State.inactivityTimer = 0;

        State.avatar.mood = "focused";
        State.avatar.moodScore = 0.72;
        State.avatar.recentDeliveryTimer = 0;
        State.avatar.rotateTimer = State.avatar.rotateInterval;

        setupDay(0, false);
      }

      function startDay5Boss() {
        State.boss.active = true;
        State.boss.hp = State.boss.maxHp;
        State.boss.hitFlash = 0;
        State.boss.attackTimer = 7.5;
        State.boss.spawnTimer = 1.0;
        State.boss.heatWaveTimer = 0;
        State.screenShake = 10;

        showBanner("MAJOR INCIDENT!!", "3RD-PARTY SUPPLIER OUTAGE!", PAL.crimson, 3.0);
        showStakeholder("boss", "APEX VENDOR CORP", "OUR SERVERS CRASHED!", "GOOD LUCK WITH SLA!", 999);
        AudioEngine.sfxBossAlarm();
        Haptics.trigger("large");
        spawnCard("supplier");
      }

      function triggerBossAttack() {
        const roll = Math.random();
        State.screenShake = 6;
        AudioEngine.sfxBossAttack();
        Haptics.trigger("medium");

        if (roll < 0.40) {
          const targetCol = 1 + Math.floor(Math.random() * 4);
          State.colModifiers[targetCol] = { type: "frozen", label: "API FROZEN!", mult: 0.0, timer: 5.5, maxTimer: 5.5 };
          showStakeholder("boss", "APEX VENDOR CORP", "API GATEWAY DOWN!", `${COL_DEFS[targetCol].name} FROZEN!`, 999);
          addPopup(colX(targetCol) + COL_W * 0.5, BOARD_TOP + 64, "API FROZEN!", PAL.cyan, 1.15);
        } else if (roll < 0.72) {
          spawnCard("blocker");
          spawnCard("blocker");
          showStakeholder("boss", "APEX VENDOR CORP", "SLA BREACH SURGE!", "+2 BLOCKER CARDS!", 999);
          addPopup(colX(0) + COL_W * 0.5, BOARD_TOP + 64, "+2 BLOCKERS!", PAL.amber, 1.15);
        } else {
          State.boss.heatWaveTimer = 6.5;
          showStakeholder("boss", "APEX VENDOR CORP", "NOT OUR FAULT!!", "CARDS BOIL 2x FAST!", 999);
          addPopup(390, BOARD_TOP + 64, "HEAT WAVE! BOIL x2!", PAL.crimson, 1.15);
        }
      }

      function canDragCard(card) {
        if (!card) return false;
        if (card.col === 0) return true;
        if (card.col >= 1 && card.col <= 4) return card.ready;
        return false;
      }

      function moveCardToColumn(card, targetCol) {
        card.col = targetCol;
        card.slotOrder = Date.now() + cardUid++;
        card.scaleX = 1.16;
        card.scaleY = 0.85;
        card.waitAfterReady = 0;
        card.boilLevel = 0;
        card.boilPenaltyTimer = 0;

        if (targetCol === 5) {
          deliverCard(card);
        } else {
          card.progress = 0;
          card.ready = false;
          card.readyDinged = false;
          AudioEngine.sfxDrop();
          Haptics.trigger("small");
        }
      }

      function deliverCard(card) {
        State.cards = State.cards.filter(c => c !== card);

        const earned = Math.round(card.value * State.flowStreak);
        State.score += earned;
        saveHighScore();

        State.totalDelivered++;
        State.dayDelivered++;
        State.avatar.recentDeliveryTimer = 2.6;

        if (State.flowStreak < 5) State.flowStreak++;
        if (State.flowStreak > State.maxStreakReached) State.maxStreakReached = State.flowStreak;

        const doneCenterX = colX(5) + COL_W * 0.5;
        const doneY = Math.min(BOARD_BOTTOM - 56, Math.max(BOARD_TOP + 76, card.y + CARD_H * 0.5));

        State.doneGhosts.unshift({ title: card.title, stripe: card.stripe, icon: card.icon });
        if (State.doneGhosts.length > 5) State.doneGhosts.pop();

        // Boss Damage if Supplier Incident delivered!
        if (card.type === "supplier" && State.boss.active) {
          State.boss.hp = Math.max(0, State.boss.hp - 1);
          State.boss.hitFlash = 0.45;
          State.hitStop = 0.085;
          State.screenShake = 11;
          spawnConfetti(doneCenterX, doneY, 68);
          spawnConfetti(PANEL_X + PANEL_W * 0.5, PANEL_Y + 130, 42);
          addPopup(doneCenterX, doneY - 14, `BOSS HIT! +${earned}`, PAL.coral, 1.35);
          addPopup(PANEL_X + PANEL_W * 0.5, PANEL_Y + 115, "-1 HP!", PAL.amberHi, 1.4);
          AudioEngine.sfxBossHit();
          Haptics.trigger("large");

          if (State.boss.hp <= 0) {
            State.boss.active = false;
            State.score += 1500;
            saveHighScore();
            State.cards = [];
            State.colModifiers = {};
            State.mode = "victory";
            State.endScreenIdleTimer = 0;
            State.avatar.mood = "thriving";
            AudioEngine.sfxVictory();
            Haptics.trigger("large");
            for (let k = 0; k < 5; k++) spawnConfetti(140 + k * 180, 180 + (k % 2) * 80, 48);
          } else {
            showStakeholder("boss", "APEX VENDOR CORP", "OUCH! SLA PATCHED!", `${State.boss.hp} INCIDENTS LEFT!`, 999);
          }
          return;
        }

        spawnConfetti(doneCenterX, doneY, card.type === "cyber" ? 56 : 36);
        addPopup(doneCenterX, doneY - 12, `+${earned}`, card.type === "cyber" ? PAL.crimson : PAL.mintLo, card.type === "cyber" ? 1.3 : 1.08);
        if (State.flowStreak >= 2) addPopup(doneCenterX, doneY + 14, `x${State.flowStreak} FLOW!`, PAL.coral, 0.95);

        if (card.type === "cyber") {
          State.morale = Math.min(State.maxMorale, State.morale + 1);
          State.hitStop = 0.06;
          State.screenShake = 5;
          showStakeholder("cyber", "SEC OPS", "THREAT CLEARED!", "+1 MORALE HEART!", 4.2);
          Haptics.trigger("medium");
        } else {
          if (State.flowStreak >= 3) State.hitStop = 0.035;
          Haptics.trigger("medium");
        }
        AudioEngine.sfxDelivery(State.flowStreak);

        const cfg = getDayCfg();
        if (cfg.isBossDay) {
          if (!State.boss.active && State.dayDelivered >= cfg.target) startDay5Boss();
        } else if (State.dayDelivered >= cfg.target) {
          State.score += 250 * cfg.day;
          saveHighScore();
          State.morale = Math.min(State.maxMorale, State.morale + 1);
          AudioEngine.sfxDayClear();
          Haptics.trigger("large");
          spawnConfetti(LOGICAL_W * 0.4, LOGICAL_H * 0.35, 58);
          cycleAvatar(false);
          setupDay(State.dayIndex + 1, false);
        }
      }

      /* ============================================================
         8. DISRUPTIONS & STAKEHOLDER EVENTS
         ============================================================ */
      function triggerDisruption() {
        const cfg = getDayCfg();
        const pick = cfg.allowedEvents[Math.floor(Math.random() * cfg.allowedEvents.length)];

        if (pick === "sick") {
          const targetCol = 2 + Math.floor(Math.random() * 3);
          if (State.colModifiers[targetCol] && State.colModifiers[targetCol].type === "frozen") return;
          State.colModifiers[targetCol] = { type: "sick", label: "SICK -45%", mult: 0.55, timer: 13.5, maxTimer: 13.5 };
          if (!State.boss.active) showStakeholder("leader", "TEAM LEAD", "STAFF OFF SICK!", `${COL_DEFS[targetCol].name} SLOWED!`);
          AudioEngine.sfxStakeholder();
        } else if (pick === "pet") {
          const count = State.dayIndex >= 3 ? 3 : 2;
          for (let i = 0; i < count; i++) spawnCard("pet");
          if (!State.boss.active) showStakeholder("manager", "SR. MANAGER", "PET PROJECT!!", `+${count} EXTRA CARDS!`);
          AudioEngine.sfxStakeholder();
          State.screenShake = 4;
        } else if (pick === "policy") {
          if (State.colModifiers[1] && State.colModifiers[1].type === "frozen") return;
          State.colModifiers[1] = { type: "policy", label: "POLICY -40%", mult: 0.60, timer: 13.5, maxTimer: 13.5 };
          if (!State.boss.active) showStakeholder("manager", "SR. MANAGER", "NEW WORK POLICY!", "APPROVALS SLOWED!");
          AudioEngine.sfxStakeholder();
        }
      }

      function triggerCyberEmergency() {
        if (State.cards.some(c => c.type === "cyber")) return;
        const card = spawnCard("cyber");
        if (!card) return;
        if (!State.boss.active) showStakeholder("cyber", "CYBER ALERT!", "URGENT INCIDENT!", "EXPEDITE TO DONE!", 5.5);
        AudioEngine.sfxCyberAlarm();
        Haptics.trigger("large");
        State.screenShake = 6;
      }

      /* ============================================================
         9. SELF-PLAYING ATTRACT MODE AI
         ============================================================ */
      function pickAITask() {
        for (let col = 4; col >= 0; col--) {
          const sup = State.cards.find(c => c.col === col && c.type === "supplier" && canDragCard(c));
          if (sup) return { card: sup, targetCol: col + 1 };
        }
        for (let col = 4; col >= 0; col--) {
          const cyb = State.cards.find(c => c.col === col && c.type === "cyber" && canDragCard(c));
          if (cyb) return { card: cyb, targetCol: col + 1 };
        }
        for (let col = 4; col >= 1; col--) {
          const blk = State.cards.find(c => c.col === col && c.type === "blocker" && c.ready);
          if (blk) return { card: blk, targetCol: col + 1 };
        }
        for (let col = 4; col >= 1; col--) {
          const boiling = State.cards.filter(c => c.col === col && c.ready && c.boilLevel > 0.04).sort((a, b) => b.boilLevel - a.boilLevel)[0];
          if (boiling) return { card: boiling, targetCol: col + 1 };
        }
        for (let col = 4; col >= 1; col--) {
          const nextCol = col + 1;
          const nextCount = getCardsInColumn(nextCol).length;
          const readyCard = State.cards.find(c => c.col === col && c.ready);
          if (readyCard && (nextCol === 5 || nextCount < COL_DEFS[nextCol].wipLimit)) return { card: readyCard, targetCol: nextCol };
        }
        const approvedCount = getCardsInColumn(1).length;
        const newCards = getCardsInColumn(0);
        if (newCards.length > 0 && (approvedCount < COL_DEFS[1].wipLimit || newCards.length >= 5)) {
          const pick = newCards.find(c => c.type === "supplier") || newCards.find(c => c.type === "cyber") || newCards.find(c => c.type === "blocker") || newCards[0];
          return { card: pick, targetCol: 1 };
        }
        for (let col = 4; col >= 1; col--) {
          const stalled = State.cards.find(c => c.col === col && c.ready && c.waitAfterReady > 2.8);
          if (stalled) return { card: stalled, targetCol: col + 1 };
        }
        return null;
      }

      function updateAI(dt) {
        if (!State.attractMode || State.mode !== "playing") return;
        const ai = State.ai;
        const moveSpeed = 540;

        if (ai.state === "idle") {
          ai.waitTimer -= dt;
          if (ai.waitTimer <= 0) {
            const task = pickAITask();
            if (task) { ai.targetCard = task.card; ai.targetCol = task.targetCol; ai.state = "moveToCard"; }
            else ai.waitTimer = 0.22;
          }
        } else if (ai.state === "moveToCard") {
          if (!ai.targetCard || !State.cards.includes(ai.targetCard) || !canDragCard(ai.targetCard)) {
            ai.state = "idle"; ai.targetCard = null; ai.waitTimer = 0.18; return;
          }
          const tx = ai.targetCard.x + CARD_W * 0.5, ty = ai.targetCard.y + CARD_H * 0.5;
          const dx = tx - ai.x, dy = ty - ai.y, dist = Math.hypot(dx, dy);
          if (dist < 10) {
            ai.x = tx; ai.y = ty;
            State.draggedCard = ai.targetCard;
            State.dragOffsetX = CARD_W * 0.5; State.dragOffsetY = CARD_H * 0.5;
            ai.targetCard.scaleX = 1.08; ai.targetCard.scaleY = 1.08;
            AudioEngine.sfxPickup();
            ai.state = "dragToCol";
          } else {
            ai.x += (dx / dist) * Math.min(dist, moveSpeed * dt);
            ai.y += (dy / dist) * Math.min(dist, moveSpeed * dt);
          }
        } else if (ai.state === "dragToCol") {
          if (!State.draggedCard || !State.cards.includes(State.draggedCard)) {
            State.draggedCard = null; ai.state = "idle"; return;
          }
          const destIdx = getCardsInColumn(ai.targetCol, State.draggedCard).length;
          const destPos = ai.targetCol === 5 ? { x: colX(5) + 6, y: BOARD_TOP + 84 } : cardSlotPos(ai.targetCol, destIdx);
          const tx = destPos.x + CARD_W * 0.5, ty = destPos.y + CARD_H * 0.5;
          const dx = tx - ai.x, dy = ty - ai.y, dist = Math.hypot(dx, dy);

          State.draggedCard.x = ai.x - State.dragOffsetX;
          State.draggedCard.y = ai.y - State.dragOffsetY;

          if (dist < 12) {
            const card = State.draggedCard;
            State.draggedCard = null;
            moveCardToColumn(card, ai.targetCol);
            ai.targetCard = null; ai.state = "idle"; ai.waitTimer = 0.28;
          } else {
            ai.x += (dx / dist) * Math.min(dist, moveSpeed * 1.05 * dt);
            ai.y += (dy / dist) * Math.min(dist, moveSpeed * 1.05 * dt);
          }
        }
      }

      /* ============================================================
         10. MAIN UPDATE LOOP (CLAMPED 60 FPS)
         ============================================================ */
      function update(rawDt) {
        const dt = Math.min(rawDt, 0.05);
        State.time += dt;

        if (State.avatar.wipeTimer > 0) State.avatar.wipeTimer = Math.max(0, State.avatar.wipeTimer - dt);

        if (State.mode !== "playing") {
          State.endScreenIdleTimer += dt;
          if (State.endScreenIdleTimer >= State.inactivityLimit) resetWeek(true);
          updateParticlesAndPopups(dt);
          return;
        }

        if (State.hitStop > 0) {
          State.hitStop -= dt;
          updateParticlesAndPopups(dt);
          return;
        }

        if (State.screenShake > 0) State.screenShake = Math.max(0, State.screenShake - dt * 22);
        if (State.pointer.invalidTimer > 0) State.pointer.invalidTimer = Math.max(0, State.pointer.invalidTimer - dt);
        if (State.avatar.recentDeliveryTimer > 0) State.avatar.recentDeliveryTimer = Math.max(0, State.avatar.recentDeliveryTimer - dt);
        if (State.boss.hitFlash > 0) State.boss.hitFlash = Math.max(0, State.boss.hitFlash - dt);
        if (State.boss.heatWaveTimer > 0) State.boss.heatWaveTimer = Math.max(0, State.boss.heatWaveTimer - dt);

        State.avatar.rotateTimer -= dt;
        if (State.avatar.rotateTimer <= 0) cycleAvatar(true);

        if (!State.attractMode && !State.draggedCard) {
          State.inactivityTimer += dt;
          if (State.inactivityTimer >= State.inactivityLimit) {
            State.attractMode = true;
            State.ai.x = State.pointer.x;
            State.ai.y = Math.min(BOARD_BOTTOM - 20, State.pointer.y);
            State.ai.state = "idle";
            State.ai.waitTimer = 0.3;
          }
        }

        if (State.banner.active) {
          State.banner.timer -= dt;
          if (State.banner.timer <= 0) State.banner.active = false;
        }

        if (State.stakeholder.active && !State.boss.active) {
          State.stakeholder.popAnim = Math.max(0, State.stakeholder.popAnim - dt * 5);
          State.stakeholder.timer -= dt;
          if (State.stakeholder.timer <= 0) State.stakeholder.active = false;
        } else if (State.boss.active && State.stakeholder.popAnim > 0) {
          State.stakeholder.popAnim = Math.max(0, State.stakeholder.popAnim - dt * 5);
        }

        for (const colKey of Object.keys(State.colModifiers)) {
          const mod = State.colModifiers[colKey];
          mod.timer -= dt;
          if (mod.timer <= 0) delete State.colModifiers[colKey];
        }

        const cfg = getDayCfg();

        State.spawnTimer -= dt;
        if (State.spawnTimer <= 0) {
          spawnCard(Math.random() < cfg.blockerChance ? "blocker" : "regular");
          State.spawnTimer = cfg.spawnRate * (0.85 + Math.random() * 0.3);
        }

        if (State.boss.active) {
          const activeSupplierCount = State.cards.filter(c => c.type === "supplier").length;
          State.boss.spawnTimer -= dt;
          if (State.boss.spawnTimer <= 0) {
            if (activeSupplierCount < Math.min(2, State.boss.hp)) spawnCard("supplier");
            State.boss.spawnTimer = 5.5;
          }
          State.boss.attackTimer -= dt;
          if (State.boss.attackTimer <= 0) {
            triggerBossAttack();
            State.boss.attackTimer = 9.2;
          }
        } else {
          State.disruptionTimer -= dt;
          if (State.disruptionTimer <= 0) {
            triggerDisruption();
            State.disruptionTimer = cfg.disruptionRate;
          }
        }

        if (cfg.cyberRate < 100) {
          State.cyberTimer -= dt;
          if (State.cyberTimer <= 0) {
            triggerCyberEmergency();
            State.cyberTimer = cfg.cyberRate;
          }
        }

        let anyWipExceeded = false;
        for (let c = 1; c <= 4; c++) {
          if (getCardsInColumn(c).length > COL_DEFS[c].wipLimit) anyWipExceeded = true;
        }
        if (anyWipExceeded && !State.boss.active && (!State.stakeholder.active || State.stakeholder.kind === "overworked")) {
          showStakeholder("overworked", "TEAM MEMBER", "TOO MUCH WIP!!", "OVERBURDENED! SLOW!", 2.2);
        }

        for (let colIdx = 0; colIdx <= 4; colIdx++) {
          const colCards = getCardsInColumn(colIdx, State.draggedCard);
          colCards.forEach((card, idx) => {
            const slot = cardSlotPos(colIdx, idx);
            card.x += (slot.x - card.x) * Math.min(1, dt * 15);
            card.y += (slot.y - card.y) * Math.min(1, dt * 15);
          });
        }

        let boilingCount = 0;
        let hasCyber = false;
        const expiredCyber = [];

        for (const card of State.cards) {
          card.scaleX += (1 - card.scaleX) * Math.min(1, dt * 14);
          card.scaleY += (1 - card.scaleY) * Math.min(1, dt * 14);
          if (card.shakeTimer > 0) card.shakeTimer = Math.max(0, card.shakeTimer - dt);

          if (card.type === "cyber") {
            hasCyber = true;
            card.cyberTimer -= dt;
            if (card.cyberTimer <= 0) { expiredCyber.push(card); continue; }
          }

          if (card.col >= 1 && card.col <= 4 && card !== State.draggedCard) {
            const colCards = getCardsInColumn(card.col);
            const wipOver = Math.max(0, colCards.length - COL_DEFS[card.col].wipLimit);
            let speedMult = 1.0;

            if (wipOver === 1) speedMult *= 0.55;
            else if (wipOver >= 2) speedMult *= 0.35;

            if (colCards.some(other => other !== card && other.type === "blocker") && card.type !== "blocker") {
              speedMult *= 0.50;
            }
            if (State.colModifiers[card.col]) speedMult *= State.colModifiers[card.col].mult;

            if (!card.ready) {
              card.progress += (dt / card.workDuration) * speedMult;
              if (card.progress >= 1) {
                card.progress = 1;
                card.ready = true;
                card.scaleX = 1.14;
                card.scaleY = 0.88;
                if (!card.readyDinged) { card.readyDinged = true; AudioEngine.sfxReadyDing(); }
              }
            } else {
              const heatMult = State.boss.heatWaveTimer > 0 ? 2.0 : 1.0;
              card.waitAfterReady += dt * heatMult;
              if (card.waitAfterReady > cfg.boilGrace) {
                card.boilLevel = Math.min(1, (card.waitAfterReady - cfg.boilGrace) / 5.0);
                boilingCount++;

                card.boilSteamTimer -= dt;
                if (card.boilSteamTimer <= 0) {
                  spawnSteam(card.x + CARD_W * 0.5, card.y + 4, card.boilLevel > 0.5);
                  card.boilSteamTimer = 0.25 - card.boilLevel * 0.13;
                }

                card.boilPenaltyTimer += dt;
                if (card.boilPenaltyTimer >= 2.2) {
                  card.boilPenaltyTimer = 0;
                  State.score = Math.max(0, State.score - 15);
                  State.flowStreak = 1;
                  State.boilPenaltiesTaken++;
                  addPopup(card.x + CARD_W * 0.5, card.y, "-15", PAL.crimson, 0.95);
                  AudioEngine.sfxBoilTick();
                  Haptics.trigger("small");
                }
              }
            }
          }
        }

        for (const card of expiredCyber) {
          if (State.draggedCard === card) State.draggedCard = null;
          State.cards = State.cards.filter(c => c !== card);
          State.morale = Math.max(0, State.morale - 2);
          State.score = Math.max(0, State.score - 200);
          State.flowStreak = 1;
          State.screenShake = 10;
          addPopup(card.x + CARD_W * 0.5, card.y, "BREACH! -200", PAL.crimson, 1.25);
          if (!State.boss.active) showStakeholder("cyber", "BREACH!!", "INCIDENT FAILED!", "-2 MORALE!", 4.5);
          AudioEngine.sfxPointLoss();
          Haptics.trigger("large");
        }

        const newCount = getCardsInColumn(0).length;
        const wasCritical = State.bottleneckCritical;
        State.bottleneckCritical = (boilingCount >= 2 || newCount >= 6);
        if (State.bottleneckCritical) {
          if (!wasCritical) Haptics.trigger("large");
          State.bottleneckDrainTimer += dt;
          if (State.bottleneckDrainTimer >= 5.5) {
            State.bottleneckDrainTimer = 0;
            State.morale = Math.max(0, State.morale - 1);
            State.screenShake = 6;
            addPopup(390, BOARD_TOP + 24, "OVERLOAD! -1 MORALE", PAL.crimson, 1.15);
            AudioEngine.sfxPointLoss();
          }
        } else {
          State.bottleneckDrainTimer = 0;
        }

        let targetMoodScore = 0.72;
        if (boilingCount >= 2 || State.morale <= 2 || State.bottleneckCritical || hasCyber) {
          State.avatar.mood = "stressed"; targetMoodScore = 0.18;
        } else if (anyWipExceeded || boilingCount === 1 || State.boss.heatWaveTimer > 0) {
          State.avatar.mood = "concerned"; targetMoodScore = 0.45;
        } else if (State.flowStreak >= 3 || State.avatar.recentDeliveryTimer > 0) {
          State.avatar.mood = "thriving"; targetMoodScore = 0.96;
        } else {
          State.avatar.mood = "focused"; targetMoodScore = 0.72;
        }
        State.avatar.moodScore += (targetMoodScore - State.avatar.moodScore) * Math.min(1, dt * 6);

        if (State.morale <= 0) {
          State.mode = "burnout";
          State.endScreenIdleTimer = 0;
          State.draggedCard = null;
          State.avatar.mood = "stressed";
          State.avatar.moodScore = 0.08;
          saveHighScore();
          AudioEngine.sfxBurnout();
          Haptics.trigger("large");
          return;
        }

        updateAI(dt);
        updateParticlesAndPopups(dt);
        AudioEngine.updateMusic(dt, boilingCount > 0 || hasCyber || State.bottleneckCritical, State.boss.active);
      }

      function updateParticlesAndPopups(dt) {
        for (let i = State.particles.length - 1; i >= 0; i--) {
          const p = State.particles[i];
          p.life -= dt;
          if (p.life <= 0) { State.particles.splice(i, 1); continue; }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.kind === "ribbon" || p.kind === "star") {
            p.vy += 350 * dt;
            p.vx *= 0.985;
            p.rot += p.vrot * dt;
          }
        }
        for (let i = State.popups.length - 1; i >= 0; i--) {
          const pop = State.popups[i];
          pop.life -= dt;
          if (pop.life <= 0) { State.popups.splice(i, 1); continue; }
          pop.y += pop.vy * dt;
          pop.vy *= 0.95;
        }
      }

      /* ============================================================
         11. HI-BIT RENDERING HELPERS (CHAMFERED PIXEL CORNERS & BEVELS)
         ============================================================ */
      function drawPixelRoundBox(x, y, w, h, fill, outline = null, hiTop = null, loBot = null) {
        const ix = Math.round(x), iy = Math.round(y), iw = Math.round(w), ih = Math.round(h);
        if (outline) {
          ctx.fillStyle = outline;
          ctx.fillRect(ix + 2, iy, iw - 4, ih);
          ctx.fillRect(ix, iy + 2, iw, ih - 4);
          ctx.fillRect(ix + 1, iy + 1, iw - 2, ih - 2);
        }
        const pad = outline ? 2 : 0;
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fillRect(ix + pad, iy + pad, iw - pad * 2, ih - pad * 2);
        }
        if (hiTop && iw > 8) {
          ctx.fillStyle = hiTop;
          ctx.fillRect(ix + pad + 1, iy + pad, iw - pad * 2 - 2, 2);
        }
        if (loBot && iw > 8) {
          ctx.fillStyle = loBot;
          ctx.fillRect(ix + pad + 1, iy + ih - pad - 2, iw - pad * 2 - 2, 2);
        }
      }

      function drawText(text, x, y, size = 12, color = PAL.ink, align = "left", shadow = null) {
        ctx.font = `900 ${size}px "Courier New", Courier, monospace`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        const ix = Math.round(x), iy = Math.round(y);
        if (shadow) { ctx.fillStyle = shadow; ctx.fillText(text, ix + 1, iy + 2); }
        ctx.fillStyle = color;
        ctx.fillText(text, ix, iy);
      }

      function render() {
        ctx.imageSmoothingEnabled = false;
        ctx.save();

        if (State.screenShake > 0.2) {
          ctx.translate(
            Math.round((Math.random() - 0.5) * State.screenShake * 2),
            Math.round((Math.random() - 0.5) * State.screenShake * 2)
          );
        }

        // Studio Off-White Surface (#F6F8FC) with subtle frame bevel & corner pins
        ctx.fillStyle = PAL.studioBg;
        ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

        // Subtle tactile whiteboard frame border in Zone 2
        ctx.fillStyle = PAL.studioRim;
        ctx.fillRect(6, 50, 790, 444);
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(8, 52, 786, 440);

        // Subtle pixel corner pins on whiteboard frame
        const pins = [[10, 54], [788, 54], [10, 486], [788, 486]];
        for (const [px, py] of pins) {
          ctx.fillStyle = "#B8C4DC";
          ctx.fillRect(px, py, 4, 4);
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(px, py, 2, 2);
        }

        // Subtle studio dot grid
        ctx.fillStyle = "#E4EAF5";
        for (let gx = 20; gx < 792; gx += 20) {
          for (let gy = BOARD_TOP + 16; gy < BOARD_BOTTOM; gy += 20) {
            ctx.fillRect(gx, gy, 2, 2);
          }
        }

        // ZONE 1: Top Arcade HUD (y: 0..48)
        renderHUD();

        // ZONE 2: Main Play Area (y: 48..496)
        renderColumns();
        if (State.draggedCard) renderSnapGhost(State.draggedCard);
        for (const card of State.cards) {
          if (card !== State.draggedCard) renderCard(card, false);
        }
        if (State.draggedCard) renderCard(State.draggedCard, true);
        renderSidePanel();

        // ZONE 3: Bottom Player Avatar Bar (y: 496..600)
        renderAvatarBar();

        // FX, Popups, Banners & Overlays
        renderParticlesAndPopups();
        renderBanners();
        if (State.mode === "victory") renderVictoryOverlay();
        else if (State.mode === "burnout") renderBurnoutOverlay();

        renderCursor();
        renderPostFX();

        ctx.restore();
      }

      function renderHUD() {
        ctx.fillStyle = PAL.hudBg;
        ctx.fillRect(0, 0, LOGICAL_W, HUD_H);
        const bayerPat = ctx.createPattern(SPRITES.bayerLight, "repeat");
        if (bayerPat) { ctx.fillStyle = bayerPat; ctx.fillRect(0, 0, LOGICAL_W, 14); }
        ctx.fillStyle = PAL.hudRim;
        ctx.fillRect(0, 0, LOGICAL_W, 2);
        ctx.fillStyle = State.boss.active ? PAL.coral : PAL.cyan;
        ctx.fillRect(0, HUD_H - 3, LOGICAL_W, 3);

        // Brand
        drawText("KANBAN FLOW", 12, 16, 14, PAL.amberHi, "left", PAL.coralLo);
        drawText("MASTER", 12, 32, 10, PAL.cyanHi, "left");

        // CUSTOMER VALUE
        drawText("VALUE", 124, 12, 9, "#9AA6C8", "left");
        drawText(String(State.score).padStart(6, "0"), 124, 30, 16, PAL.mintHi, "left", "#0B3B2B");

        // HIGH SCORE
        drawText("BEST", 222, 12, 9, "#9AA6C8", "left");
        drawText(String(State.highScore).padStart(6, "0"), 222, 30, 14, PAL.amberHi, "left");

        // DAY 1-5 Progress OR Flashing 5-HP Boss Resolution Bar
        const cfg = getDayCfg();
        if (State.boss.active) {
          const flash = Math.floor(State.time * 8) % 2 === 0;
          drawText("BOSS: APEX VENDOR CORP", 316, 12, 10, flash ? PAL.coralHi : PAL.amberHi, "left");
          const barX = 316, barY = 22, barW = 148, barH = 16;
          drawPixelRoundBox(barX, barY, barW, barH, "#280B2B", flash ? PAL.coral : PAL.violetHi);
          const hpPct = State.boss.hp / State.boss.maxHp;
          if (hpPct > 0) {
            const fw = Math.round((barW - 6) * hpPct);
            ctx.fillStyle = flash ? PAL.crimson : PAL.coral;
            ctx.fillRect(barX + 3, barY + 3, fw, barH - 6);
            ctx.fillStyle = PAL.coralHi;
            ctx.fillRect(barX + 3, barY + 3, fw, 3);
          }
          for (let s = 1; s < State.boss.maxHp; s++) {
            ctx.fillStyle = PAL.hudDeep;
            ctx.fillRect(barX + Math.round((barW / State.boss.maxHp) * s), barY + 2, 2, barH - 4);
          }
          drawText(`${State.boss.hp}/${State.boss.maxHp} HP`, barX + barW + 6, 30, 11, PAL.amberHi, "left");
        } else {
          drawText(`DAY ${cfg.day}/5 ${cfg.short}`, 316, 12, 11, PAL.cyanHi, "left");
          const barX = 316, barY = 23, barW = 126, barH = 14;
          drawPixelRoundBox(barX, barY, barW, barH, PAL.hudDeep, PAL.cyan);
          const pct = Math.min(1, State.dayDelivered / cfg.target);
          if (pct > 0) {
            const fw = Math.round((barW - 6) * pct);
            ctx.fillStyle = PAL.mint;
            ctx.fillRect(barX + 3, barY + 3, fw, barH - 6);
            ctx.fillStyle = PAL.mintHi;
            ctx.fillRect(barX + 3, barY + 3, fw, 2);
          }
          drawText(`${State.dayDelivered}/${cfg.target} DONE`, barX + barW + 6, 30, 10, "#FFFFFF", "left");
        }

        // MORALE Shaded Pixel Hearts
        drawText("MORALE", 538, 12, 9, "#9AA6C8", "left");
        for (let i = 0; i < State.maxMorale; i++) {
          ctx.drawImage(i < State.morale ? SPRITES.heartFull : SPRITES.heartEmpty, 536 + i * 21, 21);
        }

        // FLOW STREAK Pill
        const streakCols = ["#64748B", PAL.cyan, PAL.mint, PAL.amber, PAL.coral];
        const badgeCol = streakCols[Math.min(State.flowStreak - 1, 4)];
        const pulse = State.flowStreak >= 2 ? Math.sin(State.time * 8) * 1.2 : 0;
        drawPixelRoundBox(654 - pulse, 9 - pulse, 122 + pulse * 2, 28 + pulse * 2, badgeCol, "#FFFFFF", "rgba(255,255,255,0.45)");
        drawText(`STREAK x${State.flowStreak}`, 715, 23, 12, PAL.ink, "center");
      }

      function renderColumns() {
        const bayerPat = ctx.createPattern(SPRITES.bayerLight, "repeat");

        for (let i = 0; i < COL_COUNT; i++) {
          const def = COL_DEFS[i];
          const x = colX(i);
          const count = getCardsInColumn(i).length;
          const wipOver = def.active && count > def.wipLimit;
          const mod = State.colModifiers[i];
          const isFrozen = mod && mod.type === "frozen";

          // Recessed column well with soft top inner shadow
          drawPixelRoundBox(x, BOARD_TOP, COL_W, BOARD_H, isFrozen ? "#E2F8FF" : def.well, "#CBD5E6");
          ctx.fillStyle = "rgba(30, 27, 58, 0.05)";
          ctx.fillRect(x + 3, BOARD_TOP + 36, COL_W - 6, 4);

          // Shaded Column Header
          const headerFill = isFrozen ? PAL.cyan : (wipOver ? (Math.floor(State.time * 6) % 2 === 0 ? PAL.crimson : PAL.amber) : def.accent);
          const headerHi   = isFrozen ? PAL.cyanHi : (wipOver ? PAL.amberHi : def.hi);
          const headerLo   = isFrozen ? PAL.cyanLo : (wipOver ? PAL.coralLo : def.lo);
          drawPixelRoundBox(x, BOARD_TOP, COL_W, 36, headerFill, PAL.ink, headerHi, headerLo);
          if (bayerPat) { ctx.fillStyle = bayerPat; ctx.fillRect(x + 3, BOARD_TOP + 3, COL_W - 6, 13); }

          drawText(def.name, x + COL_W * 0.5, BOARD_TOP + 12, 11, "#FFFFFF", "center", PAL.ink);

          // Sleek WIP Pill Badge
          if (def.active) {
            const pillBg = wipOver ? PAL.crimson : "rgba(255,255,255,0.88)";
            const pillTxt = wipOver ? "#FFFFFF" : PAL.ink;
            drawPixelRoundBox(x + 28, BOARD_TOP + 20, COL_W - 56, 13, pillBg);
            drawText(`WIP ${count}/${def.wipLimit}`, x + COL_W * 0.5, BOARD_TOP + 27, 9, pillTxt, "center");
          } else if (i === 0) {
            drawText(`INBOX: ${count}`, x + COL_W * 0.5, BOARD_TOP + 27, 9, count >= 6 ? PAL.amberHi : "#FFFFFF", "center", PAL.ink);
          } else {
            drawText(`DONE: ${State.totalDelivered}`, x + COL_W * 0.5, BOARD_TOP + 27, 9, PAL.ink, "center");
          }

          // Boss API Frozen Ice/Glitch Overlay
          if (isFrozen) {
            ctx.save();
            ctx.fillStyle = "rgba(0, 194, 209, 0.14)";
            ctx.fillRect(x + 2, BOARD_TOP + 38, COL_W - 4, BOARD_H - 40);
            ctx.fillStyle = PAL.cyanHi;
            for (let gy = BOARD_TOP + 54; gy < BOARD_BOTTOM - 28; gy += 42) {
              const gxOff = Math.round(Math.sin(State.time * 16 + gy) * 4);
              ctx.fillRect(x + 10 + gxOff, gy, COL_W - 20, 2);
            }
            ctx.restore();
          }

          // Column Modifier Pill at bottom of column
          if (mod) {
            const bx = x + 4, by = BOARD_BOTTOM - 26;
            drawPixelRoundBox(bx, by, COL_W - 8, 22, PAL.hudBg, isFrozen ? PAL.cyanHi : PAL.amberHi);
            if (isFrozen) ctx.drawImage(SPRITES.ic_lock, bx + 4, by + 3);
            drawText(`${mod.label} ${Math.ceil(mod.timer)}s`, bx + (isFrozen ? 22 : (COL_W - 8) * 0.5), by + 11, 8, isFrozen ? PAL.cyanHi : PAL.amberHi, isFrozen ? "left" : "center");
          }

          // Flow chevron between columns
          if (i < COL_COUNT - 1) {
            drawText("›", x + COL_W + 3, BOARD_TOP + 18, 15, PAL.inkSoft, "center");
          }

          // DONE Column Delivered History
          if (i === 5) {
            if (State.doneGhosts.length === 0) {
              drawText("DROP READY", x + COL_W * 0.5, BOARD_TOP + 166, 10, "#8E9AB8", "center");
              drawText("CARDS HERE", x + COL_W * 0.5, BOARD_TOP + 182, 10, "#8E9AB8", "center");
              drawText("FOR VALUE!", x + COL_W * 0.5, BOARD_TOP + 198, 10, PAL.mintLo, "center");
            } else {
              State.doneGhosts.forEach((g, gi) => {
                const gy = BOARD_TOP + 46 + gi * 42;
                ctx.globalAlpha = Math.max(0.32, 0.94 - gi * 0.15);
                drawPixelRoundBox(x + 6, gy, COL_W - 12, 35, "#FFFFFF", PAL.mint, "#F5FFF9");
                ctx.fillStyle = g.stripe;
                ctx.fillRect(x + 8, gy + 3, 5, 29);
                drawText(g.title, x + 17, gy + 18, 9, PAL.ink, "left");
                ctx.drawImage(SPRITES.ic_check, x + COL_W - 25, gy + 10);
                ctx.globalAlpha = 1;
              });
            }
          }
        }
      }

      function renderSnapGhost(card) {
        const targetCol = card.col + 1;
        if (targetCol > 5) return;
        const tx = colX(targetCol);
        const pulse = 0.55 + 0.35 * Math.sin(State.time * 10);

        ctx.save();
        ctx.fillStyle = targetCol === 5 ? `rgba(16, 212, 142, ${0.14 * pulse})` : `rgba(0, 194, 209, ${0.14 * pulse})`;
        ctx.fillRect(tx + 3, BOARD_TOP + 38, COL_W - 6, BOARD_H - 42);
        ctx.strokeStyle = targetCol === 5 ? PAL.mint : PAL.cyan;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(tx + 5, BOARD_TOP + 40, COL_W - 10, BOARD_H - 46);
        ctx.setLineDash([]);
        drawText(targetCol === 5 ? (card.type === "supplier" ? "HIT BOSS!" : "DELIVER!") : "DROP HERE", tx + COL_W * 0.5, BOARD_BOTTOM - 14, 10, PAL.ink, "center");
        ctx.restore();
      }

      function renderCard(card, isDragged) {
        ctx.save();

        let vibX = 0, vibY = 0;
        if (card.boilLevel > 0 && !isDragged) {
          vibX = Math.sin(State.time * (32 + card.boilLevel * 28)) * (1.2 + card.boilLevel * 3.0);
          vibY = Math.cos(State.time * 24) * (card.boilLevel * 0.8);
        }
        if (card.shakeTimer > 0) vibX += Math.sin(card.shakeTimer * 55) * 4;

        const cx = card.x + CARD_W * 0.5 + vibX;
        const cy = card.y + CARD_H * 0.5 + vibY;

        ctx.translate(Math.round(cx), Math.round(cy));
        ctx.scale(card.scaleX, card.scaleY);

        const lx = -CARD_W * 0.5, ly = -CARD_H * 0.5;

        // Soft Indigo Drop Shadow
        ctx.fillStyle = isDragged ? "rgba(30, 27, 58, 0.26)" : "rgba(30, 27, 58, 0.12)";
        ctx.fillRect(lx + (isDragged ? 6 : 2), ly + (isDragged ? 8 : 3), CARD_W - 2, CARD_H - 2);

        // Card Paper Fill & Sel-Out Border
        let bgTop = "#FFFFFF", bgBot = "#F4F7FC", border = PAL.ink;
        if (card.type === "supplier") {
          const flash = Math.floor(State.time * 8) % 2 === 0;
          bgTop = flash ? "#FFF0F8" : "#FFE2F2";
          bgBot = "#FFD4EC";
          border = flash ? PAL.coral : PAL.violet;
        } else if (card.type === "cyber") {
          const flash = Math.floor(State.time * 8) % 2 === 0;
          bgTop = flash ? "#FFF0F3" : "#FFFBE6";
          bgBot = "#FFE3EA";
          border = flash ? PAL.crimson : PAL.amber;
        } else if (card.type === "blocker") {
          bgTop = "#FFF7EB";
          bgBot = "#FFEBD1";
          border = PAL.amberLo;
        } else if (card.type === "pet") {
          bgTop = "#F7F3FF";
          bgBot = "#ECE4FF";
          border = PAL.violet;
        }

        if (card.boilLevel > 0) {
          const g = Math.round(252 - card.boilLevel * 140);
          bgTop = `rgb(255,${g},${g})`;
          bgBot = `rgb(255,${Math.max(85, g - 25)},${Math.max(95, g - 20)})`;
          border = PAL.crimson;
        }

        // Crisp Pixel-Rounded Index Card Base
        drawPixelRoundBox(lx, ly, CARD_W, CARD_H, bgTop, border);
        // Subtle 2-tone paper shading on lower half
        ctx.fillStyle = bgBot;
        ctx.fillRect(lx + 9, ly + CARD_H * 0.52, CARD_W - 12, CARD_H * 0.44 - 1);

        // Tiny Folded Bottom-Right Corner Detail
        ctx.fillStyle = "#D5DEEE";
        ctx.fillRect(lx + CARD_W - 9, ly + CARD_H - 9, 7, 7);
        ctx.fillStyle = border;
        ctx.fillRect(lx + CARD_W - 9, ly + CARD_H - 9, 1, 7);
        ctx.fillRect(lx + CARD_W - 9, ly + CARD_H - 9, 7, 1);

        // Left Priority Stripe (Animated Hazard Stripes for Blocker)
        if (card.type === "blocker") {
          const off = Math.floor(State.time * 12) % 8;
          for (let sy = 2; sy < CARD_H - 4; sy += 4) {
            ctx.fillStyle = ((sy + off) >> 2) % 2 === 0 ? PAL.amber : PAL.ink;
            ctx.fillRect(lx + 2, ly + sy, 7, Math.min(4, CARD_H - 2 - sy));
          }
        } else {
          ctx.fillStyle = card.stripe;
          ctx.fillRect(lx + 2, ly + 2, 6, CARD_H - 4);
          ctx.fillStyle = "rgba(255,255,255,0.45)";
          ctx.fillRect(lx + 2, ly + 2, 2, CARD_H - 4);
        }

        // Card Title + 16x16 Lovingly Crafted Category Icon
        drawText(card.title, lx + 12, ly + 13, 10, PAL.ink, "left");
        const ic = SPRITES["ic_" + card.icon];
        if (ic) ctx.drawImage(ic, lx + CARD_W - 20, ly + 4);

        // Soft Ready Glow Rim
        if (card.ready && card.col >= 1 && card.col <= 4 && card.boilLevel === 0) {
          ctx.strokeStyle = "rgba(16, 212, 142, 0.55)";
          ctx.lineWidth = 2;
          ctx.strokeRect(lx - 1, ly - 1, CARD_W + 2, CARD_H + 2);
        }

        if (card.col === 0) {
          drawText("PULL →", lx + 12, ly + 31, 10, card.type === "supplier" ? PAL.coral : PAL.cyanLo, "left");
          if (card.type === "supplier") drawText("BOSS DMG!", lx + 12, ly + 46, 9, PAL.crimson, "left");
          else if (card.type === "blocker") drawText("BLOCKER!", lx + 12, ly + 46, 9, PAL.amberLo, "left");
          else if (card.type === "pet") drawText("PET PROJ", lx + 12, ly + 46, 9, PAL.violet, "left");
          else if (card.type !== "cyber") drawText(`VAL +${card.value}`, lx + 12, ly + 46, 9, PAL.slateText, "left");
        } else if (card.col >= 1 && card.col <= 4) {
          // Gleaming Pixel Progress Bar with Specular Sheen & Quarter Ticks
          const barX = lx + 12, barY = ly + 24, barW = CARD_W - 18, barH = 12;
          drawPixelRoundBox(barX, barY, barW, barH, "#DDE5F2", PAL.ink);
          const fillW = Math.round((barW - 4) * Math.min(1, card.progress));
          if (fillW > 0) {
            const barCol = card.boilLevel > 0 ? PAL.crimson : (card.ready ? PAL.mint : card.stripe);
            ctx.fillStyle = barCol;
            ctx.fillRect(barX + 2, barY + 2, fillW, barH - 4);
            // Specular highlight sheen
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            ctx.fillRect(barX + 2, barY + 2, fillW, 2);
          }
          // Subtle quarter tick marks
          ctx.fillStyle = "rgba(30,27,58,0.22)";
          for (let t = 1; t <= 3; t++) {
            ctx.fillRect(barX + Math.round((barW / 4) * t), barY + 2, 1, barH - 4);
          }

          const isColFrozen = State.colModifiers[card.col] && State.colModifiers[card.col].type === "frozen";
          if (card.ready) {
            if (card.boilLevel > 0) {
              drawText("BOILING!!", lx + 12, ly + 46, 10, PAL.crimson, "left");
              if (Math.floor(State.time * 10) % 2 === 0) ctx.drawImage(SPRITES.ic_thermometer, lx + CARD_W - 22, ly + 38);
            } else {
              drawText(card.type === "supplier" ? "EXPEDITE!" : "READY! →", lx + 12, ly + 46, 9, PAL.mintLo, "left");
              ctx.drawImage(SPRITES.ic_check, lx + CARD_W - 22, ly + 38);
            }
          } else if (isColFrozen) {
            drawText("FROZEN!", lx + 12, ly + 46, 9, PAL.cyanLo, "left");
          } else {
            drawText(`WORK ${Math.floor(card.progress * 100)}%`, lx + 12, ly + 46, 9, PAL.slateText, "left");
          }
        }

        // Urgent Cyber Countdown Bar
        if (card.type === "cyber") {
          const ratio = Math.max(0, card.cyberTimer / card.cyberMax);
          drawPixelRoundBox(lx + 12, ly + 40, CARD_W - 18, 10, PAL.hudDeep);
          ctx.fillStyle = ratio < 0.35 ? PAL.crimson : PAL.amberHi;
          ctx.fillRect(lx + 14, ly + 42, Math.round((CARD_W - 22) * ratio), 6);
          drawText(`${Math.ceil(card.cyberTimer)}s`, lx + CARD_W - 8, ly + 32, 9, PAL.crimson, "right");
        }

        ctx.restore();
      }

      function renderSidePanel() {
        drawPixelRoundBox(PANEL_X, PANEL_Y, PANEL_W, PANEL_H, "#F1F5FB", PAL.ink);
        const bayerPat = ctx.createPattern(SPRITES.bayerCyan, "repeat");
        if (bayerPat) { ctx.fillStyle = bayerPat; ctx.fillRect(PANEL_X + 2, PANEL_Y + 2, PANEL_W - 4, PANEL_H - 4); }

        const bossActive = State.boss.active;

      function renderParticlesAndPopups() {
        for (const p of State.particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.translate(Math.round(p.x), Math.round(p.y));
          if (p.kind === "ribbon") {
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size * 0.5, -p.size * 0.35, p.size, p.size * 0.65);
            ctx.fillStyle = "rgba(255,255,255,0.45)";
            ctx.fillRect(-p.size * 0.5, -p.size * 0.35, p.size, 2);
          } else if (p.kind === "star") {
            ctx.fillStyle = p.color;
            ctx.fillRect(-1, -4, 2, 8);
            ctx.fillRect(-4, -1, 8, 2);
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(-1, -1, 2, 2);
          } else if (p.kind === "spark") {
            ctx.fillStyle = PAL.amberHi;
            ctx.fillRect(-2, -2, 4, 4);
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(-1, -1, 2, 2);
          } else {
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size);
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 1;
            ctx.strokeRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size);
          }
          ctx.restore();
        }

        for (const pop of State.popups) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, pop.life / (pop.maxLife * 0.45));
          drawText(pop.text, pop.x, pop.y, Math.round(14 * pop.scale), pop.color, "center", "#FFFFFF");
          ctx.restore();
        }

      function renderPostFX() {
        const grainPat = ctx.createPattern(SPRITES.grain, "repeat");

          ctx.save();
          ctx.translate(Math.round((State.time * 43) % 64), Math.round((State.time * 29) % 64));

          ctx.fillRect(-64, -64, LOGICAL_W + 128, LOGICAL_H + 128);

          LOGICAL_W * 0.5, LOGICAL_H * 0.5, LOGICAL_W * 0.38,

        );

          ? `rgba(232, 37, 78, ${0.14 + 0.07 * Math.sin(State.time * 9)})`

        ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

      /* ============================================================
         12. INPUT HANDLING (MOUSE & TOUCH DRAG-AND-DROP)
         ============================================================ */
      function getCanvasPoint(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - rect.left) / rect.width) * LOGICAL_W,
          y: ((e.clientY - rect.top) / rect.height) * LOGICAL_H
        };
      }

      function hitRect(pt, r) {
        return pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
      }

      function takeOverFromAttract() {
        Haptics.userInteracted = true;
        AudioEngine.unlock();
        State.inactivityTimer = 0;

        if (State.attractMode) {
          State.attractMode = false;
          if (State.draggedCard) State.draggedCard = null;
          State.ai.state = "idle";
          State.ai.targetCard = null;
        }
      }

      function findCardAt(x, y) {
        for (let i = State.cards.length - 1; i >= 0; i--) {
          const c = State.cards[i];
          if (x >= c.x - 4 && x <= c.x + CARD_W + 4 && y >= c.y - 4 && y <= c.y + CARD_H + 4) return c;
        }
        return null;
      }

      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        takeOverFromAttract();
        const pt = getCanvasPoint(e);
        State.pointer.x = pt.x;
        State.pointer.y = pt.y;
        State.pointer.down = true;
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

        if (hitRect(pt, AVATAR_PORTRAIT_RECT) || hitRect(pt, AVATAR_CYCLE_BTN_RECT)) {
          cycleAvatar(true);
          return;
        }

        const rotX = 686;
        for (let idx = 0; idx < AVATAR_ROSTER.length; idx++) {
          const pipRect = { x: rotX + 10 + idx * 76, y: AVATAR_BAR_Y + 46, w: 71, h: 32 };
          if (hitRect(pt, pipRect) && idx !== State.avatar.index) {
            State.avatar.prevIndex = State.avatar.index;
            State.avatar.index = idx;
            State.avatar.rotateTimer = State.avatar.rotateInterval;
            State.avatar.wipeTimer = State.avatar.wipeDuration;
            AudioEngine.sfxAvatarSwap();
            Haptics.trigger("small");
            return;
          }
        }

        if (State.mode === "victory") {
          const bw = 486, bh = 286;
          const bx = Math.round((LOGICAL_W - bw) * 0.5), by = Math.round(BOARD_TOP + (BOARD_H - bh) * 0.5);
          if (hitRect(pt, { x: bx + (bw - 220) * 0.5, y: by + 216, w: 220, h: 44 })) {
            AudioEngine.sfxPickup();
            resetWeek(false);
          }
          return;
        }

        if (State.mode === "burnout") {
          const bw = 466, bh = 264;
          const bx = Math.round((LOGICAL_W - bw) * 0.5), by = Math.round(BOARD_TOP + (BOARD_H - bh) * 0.5);
          const btnW = 180, btnH = 42, btnY = by + 194;
          if (hitRect(pt, { x: bx + 40, y: btnY, w: btnW, h: btnH })) {
            AudioEngine.sfxPickup();
            setupDay(State.dayIndex, true);
          } else if (hitRect(pt, { x: bx + bw - 40 - btnW, y: btnY, w: btnW, h: btnH })) {
            AudioEngine.sfxPickup();
            resetWeek(false);
          }
          return;
        }

        const hit = findCardAt(pt.x, pt.y);
        if (hit) {
          if (canDragCard(hit)) {
            State.draggedCard = hit;
            State.dragOffsetX = pt.x - hit.x;
            State.dragOffsetY = pt.y - hit.y;
            hit.scaleX = 1.09;
            hit.scaleY = 1.09;
            AudioEngine.sfxPickup();
            Haptics.trigger("small");
          } else {
            hit.shakeTimer = 0.28;
            State.pointer.invalidTimer = 0.35;
            const frozen = State.colModifiers[hit.col] && State.colModifiers[hit.col].type === "frozen";
            addPopup(hit.x + CARD_W * 0.5, hit.y, frozen ? "FROZEN!" : "WORKING!", frozen ? PAL.cyanLo : PAL.amberLo, 0.9);
            AudioEngine.sfxInvalid();
            Haptics.trigger("small");
          }
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        const pt = getCanvasPoint(e);
        State.pointer.x = pt.x;
        State.pointer.y = pt.y;
        if (!State.attractMode) State.inactivityTimer = 0;

        if (State.draggedCard && !State.attractMode) {
          State.draggedCard.x = pt.x - State.dragOffsetX;
          State.draggedCard.y = Math.min(BOARD_BOTTOM - CARD_H - 2, Math.max(BOARD_TOP, pt.y - State.dragOffsetY));
        }
      });

      function finishDrag(e) {
        State.pointer.down = false;
        if (e) { try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} }
        if (!State.draggedCard || State.attractMode) return;

        const card = State.draggedCard;
        State.draggedCard = null;

        const centerX = card.x + CARD_W * 0.5;
        const targetCol = card.col + 1;
        const tx = colX(targetCol);

        if (targetCol <= 5 && centerX >= tx - 16 && centerX <= tx + COL_W + 16) {
          moveCardToColumn(card, targetCol);
        } else {
          card.shakeTimer = 0.22;
          State.pointer.invalidTimer = 0.28;
          AudioEngine.sfxInvalid();
        }
      }

      canvas.addEventListener("pointerup", finishDrag);
      canvas.addEventListener("pointercancel", finishDrag);

      /* ============================================================
         13. CORNER TOGGLE BUTTONS & RESPONSIVE RESIZE
         ============================================================ */
      const btnSound = document.getElementById("btn-sound");
      const btnHaptics = document.getElementById("btn-haptics");

      btnSound.addEventListener("click", () => {
        Haptics.userInteracted = true;
        AudioEngine.unlock();
        AudioEngine.enabled = !AudioEngine.enabled;
        btnSound.textContent = AudioEngine.enabled ? "SOUND: ON" : "SOUND: OFF";
        btnSound.classList.toggle("active", AudioEngine.enabled);
        btnSound.classList.toggle("muted", !AudioEngine.enabled);
        if (AudioEngine.enabled) AudioEngine.sfxPickup();
      });

      btnHaptics.addEventListener("click", () => {
        Haptics.userInteracted = true;
        Haptics.enabled = !Haptics.enabled;
        btnHaptics.textContent = Haptics.enabled ? "HAPTICS: ON" : "HAPTICS: OFF";
        btnHaptics.classList.toggle("active", Haptics.enabled);
        btnHaptics.classList.toggle("muted", !Haptics.enabled);
        if (Haptics.enabled) Haptics.trigger("small");
      });

      function resizeCanvas() {
        const shell = document.getElementById("game-shell");
        const availW = shell.clientWidth - 16;
        const availH = shell.clientHeight - 16;
        const aspect = LOGICAL_W / LOGICAL_H;

        let w = availW, h = w / aspect;
        if (h > availH) { h = availH; w = h * aspect; }

        canvasWrap.style.width = `${Math.floor(w)}px`;
        canvasWrap.style.height = `${Math.floor(h)}px`;

        if (canvas.width !== LOGICAL_W || canvas.height !== LOGICAL_H) {
          canvas.width = LOGICAL_W;
          canvas.height = LOGICAL_H;
        }
        ctx.imageSmoothingEnabled = false;
      }

      window.addEventListener("resize", resizeCanvas);

      /* ============================================================
         14. BOOTSTRAP & LOCKED 60 FPS ANIMATION LOOP
         ============================================================ */
      let lastTime = 0;

      function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        update(dt);
        render();
        requestAnimationFrame(gameLoop);
      }

      window.onload = function () {
        try {
          initSprites();
          loadHighScore();
          resizeCanvas();
          resetWeek(true);
          requestAnimationFrame(gameLoop);
        } catch (err) {
          console.error("Initialization error:", err);
        }
      };
    })();
  </script>
</body>
</html>
