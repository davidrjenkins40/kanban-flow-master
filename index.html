<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    /* ============================================================
       RESET & RESPONSIVE MODERN ARCADE STUDIO SHELL
       ============================================================ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141229;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: radial-gradient(circle at 50% 40%, #25204A 0%, #110F24 100%);
    }

    #canvas-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 4px solid #1E1B3A;
      box-shadow:
        0 0 0 2px #00C2D1,
        0 22px 56px rgba(10, 8, 28, 0.72);
      overflow: hidden;
      background: #F6F8FC;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      cursor: none; /* Custom hi-bit shaded pixel hand cursor rendered in Canvas */
    }

    /* Non-blocking corner toggles docked cleanly in the top-right HUD reserve */
    #corner-controls {
      position: absolute;
      top: 8px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }

    .arcade-btn {
      font-family: "Courier New", Courier, monospace;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 0.4px;
      padding: 4px 9px;
      border-radius: 6px;
      border: 2px solid #1E1B3A;
      background: #F6F8FC;
      color: #1E1B3A;
      box-shadow: 0 3px 0 #1E1B3A;
      cursor: pointer;
      transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.12s ease;
      text-transform: uppercase;
      min-height: 26px;
    }

    .arcade-btn:hover {
      background: #E2FAFF;
    }

    .arcade-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1E1B3A;
    }

    .arcade-btn.active {
      background: #10D48E;
      color: #102B24;
    }

    .arcade-btn.muted {
      background: #FF3B7F;
      color: #FFFFFF;
    }

    @media (max-width: 720px) {
      #game-shell {
        padding: 2px;
      }
      #corner-controls {
        top: 4px;
        right: 5px;
        gap: 3px;
      }
      .arcade-btn {
        font-size: 9px;
        padding: 3px 5px;
        min-height: 20px;
      }
    }
  </style>
</head>

      /* ============================================================
         2. HI-BIT PIXEL ART BAKING ENGINE (CELESTE / EASTWARD STYLE)
         ============================================================ */
      function bakeSprite(w, h, scale, drawFn) {
        const c = document.createElement("canvas");
        c.width = w * scale;
        c.height = h * scale;
        const g = c.getContext("2d");
        g.imageSmoothingEnabled = false;

        const api = {
          p(x, y, col) {
            if (!col) return;
            g.fillStyle = col;
            g.fillRect(Math.floor(x) * scale, Math.floor(y) * scale, scale, scale);
          },
          rect(x, y, rw, rh, col) {
            if (!col || rw <= 0 || rh <= 0) return;
            g.fillStyle = col;
            g.fillRect(Math.floor(x) * scale, Math.floor(y) * scale, Math.floor(rw) * scale, Math.floor(rh) * scale);
          },
          rrect(x, y, rw, rh, col) {
            // 1px chamfered pixel-rounded rect
            if (!col || rw <= 2 || rh <= 2) { api.rect(x, y, rw, rh, col); return; }
            api.rect(x + 1, y, rw - 2, rh, col);
            api.rect(x, y + 1, rw, rh - 2, col);
          },
          ellipse(cx, cy, rx, ry, col) {
            g.fillStyle = col;
            for (let py = Math.floor(cy - ry); py <= Math.ceil(cy + ry); py++) {
              for (let px = Math.floor(cx - rx); px <= Math.ceil(cx + rx); px++) {
                const dx = (px - cx) / rx;
                const dy = (py - cy) / ry;
                if (dx * dx + dy * dy <= 1.0) {
                  g.fillRect(px * scale, py * scale, scale, scale);
                }
              }
            }
          },
          dither(x, y, rw, rh, col, mod = 2) {
            g.fillStyle = col;
            for (let py = Math.floor(y); py < Math.floor(y + rh); py++) {
              for (let px = Math.floor(x); px < Math.floor(x + rw); px++) {
                if ((px + py) % mod === 0) g.fillRect(px * scale, py * scale, scale, scale);
              }
            }
          }
        };

        drawFn(api, w, h);
        return c;
      }

      function createSoftBayerTile(color) {
        const bayer4 = [
          [ 0,  8,  2, 10],
          [12,  4, 14,  6],
          [ 3, 11,  1,  9],
          [15,  7, 13,  5]
        ];
        const c = document.createElement("canvas");
        c.width = 8;
        c.height = 8;
        const g = c.getContext("2d");
        g.fillStyle = color;
        for (let y = 0; y < 4; y++) {
          for (let x = 0; x < 4; x++) {
            if (bayer4[y][x] < 4) g.fillRect(x * 2, y * 2, 2, 2);
          }
        }
        return c;
      }

      function createSubtleGrainTile() {
        const c = document.createElement("canvas");
        c.width = 128;
        c.height = 128;
        const g = c.getContext("2d");
        const img = g.createImageData(128, 128);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = Math.random() > 0.5 ? 255 : 24;
          img.data[i] = v;
          img.data[i + 1] = v;
          img.data[i + 2] = v + 12;
          img.data[i + 3] = 4; // Ultra-subtle studio texture
        }
        g.putImageData(img, 0, 0);
        return c;
      }

      /**
       * Lovingly bakes a 40x36 (scaled 2x -> 80x72) modern hi-bit portrait
       * for each diverse workforce character across 4 moods & 2 animation frames.
       */
      function bakeAvatarPortrait(char, mood, frame) {
        return bakeSprite(40, 36, 2, (s) => {
          const O = PAL.ink;
          const U = PAL.umber;
          const W = "#FFFFFF";
          const R = PAL.coral;

          let hx = 0, hy = 0, by = 0;
          if (mood === "thriving") {
            hy = frame === 0 ? -1 : -2;
            by = frame === 0 ? 0 : -1;
          } else if (mood === "focused") {
            hy = frame === 0 ? 0 : 1;
          } else if (mood === "concerned") {
            hy = 1; by = 1;
            hx = frame === 0 ? 0 : 1;
          } else if (mood === "stressed") {
            hy = 1; by = 1;
            hx = frame === 0 ? -1 : 1;
          }

          // Subtle soft backdrop rim aura inside portrait
          s.dither(2, 26, 36, 8, "rgba(255,255,255,0.22)", 2);

          // 1) Back hair silhouette (wavy or bob)
          if (char.hairStyle === "wavy") {
            s.ellipse(20 + hx, 16 + hy, 10.5, 10, O);
            s.ellipse(20 + hx, 16 + hy, 9.5, 9, char.hairLo);
            s.rect(10 + hx, 16 + hy, 20, 12, O);
            s.rect(11 + hx, 16 + hy, 18, 11, char.hair);
            s.rect(11 + hx, 21 + hy, 3, 6, char.hairLo);
            s.rect(26 + hx, 21 + hy, 3, 6, char.hairLo);
          } else if (char.hairStyle === "bob") {
            s.ellipse(20 + hx, 15 + hy, 10.5, 9, O);
            s.ellipse(20 + hx, 15 + hy, 9.5, 8, char.hair);
            s.rrect(10 + hx, 15 + hy, 20, 9, char.hair);
            s.rect(10 + hx, 20 + hy, 3, 4, char.hairLo);
            s.rect(27 + hx, 20 + hy, 3, 4, char.hairLo);
          }

          // 2) Shoulders & Torso (layered clothing with highlights & folds)
          s.rrect(9, 25 + by, 22, 12, O);
          s.rrect(10, 26 + by, 20, 11, char.outfit);
          s.rect(10, 26 + by, 3, 10, char.outfitLo);
          s.rect(27, 26 + by, 3, 10, char.outfitLo);
          s.rect(13, 26 + by, 14, 2, char.outfitHi); // Shoulder rim highlight

          // Collar / Lapel / Lanyard details
          s.rect(16, 26 + by, 8, 5, char.collar);
          s.rect(18, 28 + by, 4, 4, char.outfitLo);
          if (char.lanyard) {
            s.rect(14, 26 + by, 2, 10, char.lanyard);
            s.rect(24, 26 + by, 2, 10, char.lanyard);
            s.rect(18, 32 + by, 4, 4, "#FFFFFF");
            s.rect(19, 33 + by, 2, 2, char.lanyard);
          }

          // 3) Neck with chin cast shadow
          s.rect(17 + hx, 21 + hy, 6, 6, U);
          s.rect(18 + hx, 21 + hy, 4, 5, char.skin);
          s.rect(18 + hx, 22 + hy, 4, 2, char.skinLo);

          // 4) Head & Ears (rounded 3-tone hue-shifted shading)
          s.ellipse(20 + hx, 15 + hy, 8.2, 8.2, U);
          s.ellipse(20 + hx, 15 + hy, 7.2, 7.2, char.skin);
          // Cheek/forehead specular highlight
          s.ellipse(18 + hx, 12.5 + hy, 4.2, 3.2, char.skinHi);
          // Cool lower jaw shadow
          s.rect(15 + hx, 20 + hy, 10, 2, char.skinLo);
          s.rect(17 + hx, 21 + hy, 6, 1, char.skinLo);
          // Ears
          s.rect(11 + hx, 14 + hy, 2, 4, U);
          s.p(12 + hx, 15 + hy, char.skin);
          s.p(12 + hx, 16 + hy, char.skinLo);
          s.rect(27 + hx, 14 + hy, 2, 4, U);
          s.p(27 + hx, 15 + hy, char.skin);
          s.p(27 + hx, 16 + hy, char.skinLo);

          if (char.earrings) {
            s.p(12 + hx, 18 + hy, char.earrings);
            s.p(27 + hx, 18 + hy, char.earrings);
          }

          // Short neat beard (Marcus)
          if (char.beard) {
            s.rect(14 + hx, 18 + hy, 12, 3, char.hairLo);
            s.rect(15 + hx, 20 + hy, 10, 2, char.hair);
            s.rect(17 + hx, 18 + hy, 6, 1, char.skin);
          }

          // Freckles (Clara)
          if (char.freckles) {
            s.p(14 + hx, 17 + hy, "#D68A6E");
            s.p(16 + hx, 17 + hy, "#D68A6E");
            s.p(24 + hx, 17 + hy, "#D68A6E");
            s.p(26 + hx, 17 + hy, "#D68A6E");
          }

          // Gentle laugh lines (Kenji)
          if (char.laughLines) {
            s.p(13 + hx, 16 + hy, char.skinLo);
            s.p(26 + hx, 16 + hy, char.skinLo);
          }

          // 5) Front Hair with layered shine band
          if (char.hairStyle === "wavy") {
            s.ellipse(20 + hx, 9 + hy, 8.5, 4.2, O);
            s.ellipse(20 + hx, 9 + hy, 7.5, 3.2, char.hair);
            s.rect(14 + hx, 7 + hy, 8, 1, char.hairHi);
            s.rect(16 + hx, 8 + hy, 4, 1, char.hairHi);
            s.rect(12 + hx, 10 + hy, 2, 5, char.hair);
            s.rect(26 + hx, 10 + hy, 2, 5, char.hair);
          } else if (char.hairStyle === "fade") {
            s.rrect(12 + hx, 6 + hy, 16, 5, O);
            s.rrect(13 + hx, 7 + hy, 14, 3, char.hair);
            s.dither(13 + hx, 7 + hy, 14, 2, char.hairHi, 2);
            s.rect(12 + hx, 10 + hy, 2, 4, char.hairHi);
            s.rect(26 + hx, 10 + hy, 2, 4, char.hairHi);
          } else if (char.hairStyle === "swept") {
            s.ellipse(20 + hx, 9 + hy, 8.8, 4.0, O);
            s.ellipse(20 + hx, 9 + hy, 7.8, 3.0, char.hair);
            s.rect(14 + hx, 7 + hy, 5, 2, char.hairHi);
            s.rect(22 + hx, 8 + hy, 4, 1, char.hairHi);
            s.rect(12 + hx, 10 + hy, 2, 4, char.hairHi);
            s.rect(26 + hx, 10 + hy, 2, 4, char.hairHi);
          } else if (char.hairStyle === "bob") {
            s.ellipse(20 + hx, 9 + hy, 8.8, 4.2, O);
            s.ellipse(20 + hx, 9 + hy, 7.8, 3.2, char.hair);
            s.rect(15 + hx, 7 + hy, 9, 1, char.hairHi);
            s.rect(13 + hx, 9 + hy, 5, 2, char.hair);
            s.rect(12 + hx, 10 + hy, 2, 6, char.hair);
            s.rect(26 + hx, 10 + hy, 2, 6, char.hair);
          }

          // 6) Expressive Eyes (with catchlights), Brows, Nose & Mouth
          s.p(20 + hx, 16 + hy, char.skinLo); // Subtle pixel nose

          if (mood === "thriving") {
            // Rosy cheeks + joyful curved eyes + wide beaming smile
            s.rect(13 + hx, 16 + hy, 2, 1, "#FF7DA8");
            s.rect(25 + hx, 16 + hy, 2, 1, "#FF7DA8");
            // Happy arched eyes
            s.rect(15 + hx, 14 + hy, 3, 1, O);
            s.p(15 + hx, 15 + hy, O); s.p(17 + hx, 15 + hy, O);
            s.rect(22 + hx, 14 + hy, 3, 1, O);
            s.p(22 + hx, 15 + hy, O); s.p(24 + hx, 15 + hy, O);
            // Smile
            s.rect(17 + hx, 18 + hy, 6, 2, O);
            s.rect(18 + hx, 18 + hy, 4, 1, W);
          } else if (mood === "focused") {
            // Calm confident eyes with white catchlights
            s.rect(15 + hx, 12 + hy, 3, 1, char.hairLo);
            s.rect(22 + hx, 12 + hy, 3, 1, char.hairLo);
            s.rect(15 + hx, 14 + hy, 3, 2, O);
            s.rect(22 + hx, 14 + hy, 3, 2, O);
            s.p(15 + hx, 14 + hy, W);
            s.p(22 + hx, 14 + hy, W);
            // Gentle confident smile
            s.rect(18 + hx, 19 + hy, 4, 1, char.beard ? W : O);
            s.p(22 + hx, 18 + hy, char.beard ? W : O);
          } else if (mood === "concerned") {
            // Furrowed brows + worried eyes
            s.rect(14 + hx, 12 + hy, 3, 1, O); s.p(17 + hx, 13 + hy, O);
            s.rect(23 + hx, 12 + hy, 3, 1, O); s.p(22 + hx, 13 + hy, O);
            s.rect(15 + hx, 14 + hy, 3, 2, W);
            s.rect(22 + hx, 14 + hy, 3, 2, W);
            s.p(16 + hx, 15 + hy, O);
            s.p(23 + hx, 15 + hy, O);
            // Slight frown
            s.rect(18 + hx, 19 + hy, 4, 1, O);
            s.p(17 + hx, 20 + hy, O);
          } else if (mood === "stressed") {
            // Flushed cheeks + wide panicked eyes + open stressed mouth
            s.rect(13 + hx, 16 + hy, 3, 2, R);
            s.rect(24 + hx, 16 + hy, 3, 2, R);
            s.rect(15 + hx, 13 + hy, 3, 3, W);
            s.rect(22 + hx, 13 + hy, 3, 3, W);
            s.p(16 + hx, 14 + hy, O);
            s.p(23 + hx, 14 + hy, O);
            s.rect(17 + hx, 18 + hy, 6, 3, O);
            s.rect(18 + hx, 19 + hy, 4, 1, W);
          }

          // Sleek glasses with diagonal pixel glint (Priya)
          if (char.glasses) {
            s.rect(13 + hx, 13 + hy, 6, 1, O);
            s.rect(21 + hx, 13 + hy, 6, 1, O);
            s.rect(13 + hx, 16 + hy, 6, 1, O);
            s.rect(21 + hx, 16 + hy, 6, 1, O);
            s.rect(13 + hx, 13 + hy, 1, 4, O);
            s.rect(18 + hx, 13 + hy, 1, 4, O);
            s.rect(21 + hx, 13 + hy, 1, 4, O);
            s.rect(26 + hx, 13 + hy, 1, 4, O);
            s.rect(19 + hx, 14 + hy, 2, 1, O);
            s.p(14 + hx, 14 + hy, PAL.cyanHi);
            s.p(22 + hx, 14 + hy, PAL.cyanHi);
          }

          // 7) Body Language & Mood FX
          if (mood === "thriving") {
            const lift = frame === 0 ? 0 : -1;
            // Celebratory raised fists
            s.rrect(4, 19 + lift, 5, 11, O);
            s.rect(5, 20 + lift, 3, 9, char.outfit);
            s.rrect(4, 16 + lift, 5, 4, char.skin);
            s.p(5, 16 + lift, char.skinHi);
            s.rrect(31, 19 + lift, 5, 11, O);
            s.rect(32, 20 + lift, 3, 9, char.outfit);
            s.rrect(31, 16 + lift, 5, 4, char.skin);
            s.p(32, 16 + lift, char.skinHi);
            // Floating 4-point pixel sparkles
            const sp1 = frame === 0 ? PAL.amberHi : PAL.cyanHi;
            const sp2 = frame === 0 ? PAL.mintHi  : PAL.coralHi;
            s.p(5, 6 + lift, sp1); s.p(4, 7 + lift, sp1); s.p(6, 7 + lift, sp1); s.p(5, 8 + lift, sp1);
            s.p(34, 8 - lift, sp2); s.p(33, 9 - lift, sp2); s.p(35, 9 - lift, sp2); s.p(34, 10 - lift, sp2);
          } else if (mood === "focused") {
            // Relaxed steady arms
            s.rect(7, 27 + by, 3, 9, O);
            s.rect(8, 28 + by, 2, 8, char.outfitLo);
            s.rect(30, 27 + by, 3, 9, O);
            s.rect(30, 28 + by, 2, 8, char.outfitLo);
          } else if (mood === "concerned") {
            // Thinking hand near chin + animated sweat drop
            s.rect(7, 27 + by, 3, 9, O);
            s.rect(8, 28 + by, 2, 8, char.outfitLo);
            s.rrect(28, 22 + by, 5, 9, O);
            s.rect(29, 23 + by, 3, 7, char.outfit);
            s.rrect(26, 20 + by, 4, 3, char.skin);
            const sy = frame === 0 ? 7 : 9;
            s.p(31, sy, PAL.cyanLo);
            s.rect(30, sy + 1, 3, 3, PAL.cyan);
            s.p(31, sy + 1, W);
          } else if (mood === "stressed") {
            // Hands near head + crimson stress marks
            const sy = frame === 0 ? 0 : 1;
            s.rrect(5, 16 + sy, 5, 12, O);
            s.rect(6, 17 + sy, 3, 10, char.outfit);
            s.rrect(6, 14 + sy, 4, 4, char.skin);
            s.rrect(30, 16 + sy, 5, 12, O);
            s.rect(31, 17 + sy, 3, 10, char.outfit);
            s.rrect(30, 14 + sy, 4, 4, char.skin);
            // Stress cross-vein & lightning marks
            s.rect(5, 5 + sy, 3, 1, R); s.rect(6, 4 + sy, 1, 3, R);
            s.rect(32, 6 - sy, 3, 1, PAL.amber); s.rect(33, 5 - sy, 1, 3, PAL.amber);
          }
        });
      }

      const SPRITES = {};

        for (const name of iconNames) SPRITES["ic_" + name] = bakeIcon16(name);

        // 4) Stakeholder & Boss 44x40 @ 2x (=88x80) Portraits
        SPRITES.st_leader     = bakeStakeholderPortrait("leader");

        // 5) 4 Diverse Workforce Avatars x 4 Moods x 2 Frames (40x36 @ 2x = 80x72)
        const moods = ["thriving", "focused", "concerned", "stressed"];
        for (const char of AVATAR_ROSTER) {

        SPRITES.bayerLight = createSoftBayerTile("rgba(255,255,255,0.14)");
        SPRITES.bayerCyan  = createSoftBayerTile("rgba(0,194,209,0.09)");
        SPRITES.grain      = createSubtleGrainTile();
      }

      /* ============================================================
         3. SYNTHESIZED MODERN CHIPTUNE WEB AUDIO ENGINE
         ============================================================ */
      const AudioEngine = {
        ctx: null,
        enabled: true,
        unlocked: false,
        noiseBuffer: null,
        musicStep: 0,
        musicTimer: 0,

        unlock() {
          if (this.unlocked) return;
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            if (!this.ctx) {
              this.ctx = new AudioCtx();
              this._createNoiseBuffer();
            }
            if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
            this.unlocked = true;
          } catch (_) {}
        },

        _createNoiseBuffer() {
          try {
            const sr = this.ctx.sampleRate;
            const buf = this.ctx.createBuffer(1, sr * 0.4, sr);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            this.noiseBuffer = buf;
          } catch (_) {}
        },

        playTone(freq, duration, type = "square", volume = 0.075, slideTo = null, delay = 0) {
          if (!this.enabled || !this.ctx || this.ctx.state !== "running") return;
          try {
            const now = this.ctx.currentTime + delay;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);
          } catch (_) {}
        },

        playNoise(duration, volume = 0.045, highpass = 1400, delay = 0) {
          if (!this.enabled || !this.ctx || !this.noiseBuffer || this.ctx.state !== "running") return;
          try {
            const now = this.ctx.currentTime + delay;
            const src = this.ctx.createBufferSource();
            src.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = "highpass";
            filter.frequency.setValueAtTime(highpass, now);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            src.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(now);
            src.stop(now + duration + 0.02);
          } catch (_) {}
        },

        sfxPickup() { this.playTone(460, 0.055, "triangle", 0.08, 690); },
        sfxDrop() {
          this.playTone(240, 0.065, "triangle", 0.09, 150);
          this.playTone(540, 0.04, "square", 0.035, 640, 0.02);
        },
        sfxInvalid() {
          this.playTone(165, 0.11, "sawtooth", 0.06, 115);
          this.playTone(130, 0.11, "square", 0.045, 95, 0.055);
        },
        sfxReadyDing() {
          this.playTone(784, 0.065, "triangle", 0.07);
          this.playTone(1046.5, 0.12, "square", 0.045, null, 0.055);
        },
        sfxBoilTick() {
          this.playNoise(0.045, 0.032, 3000);
          this.playTone(960, 0.035, "triangle", 0.03, 1220);
        },
        sfxBlockerWarn() {
          this.playTone(300, 0.085, "sawtooth", 0.055, 210);
          this.playTone(210, 0.085, "sawtooth", 0.055, 165, 0.085);
        },
        sfxDelivery(streak) {
          const mult = Math.pow(1.06, Math.min(streak - 1, 6));
          this.playTone(523.25 * mult, 0.07, "square", 0.06, null, 0.00);
          this.playTone(659.25 * mult, 0.07, "square", 0.06, null, 0.055);
          this.playTone(783.99 * mult, 0.08, "square", 0.065, null, 0.11);
          this.playTone(1046.5 * mult, 0.19, "triangle", 0.085, null, 0.165);
        },
        sfxStakeholder() {
          this.playTone(587, 0.06, "square", 0.055, null, 0.0);
          this.playTone(440, 0.06, "square", 0.055, null, 0.07);
          this.playTone(587, 0.10, "triangle", 0.07, null, 0.14);
        },
        sfxCyberAlarm() {
          this.playTone(880, 0.12, "sawtooth", 0.065, 620, 0.0);
          this.playTone(880, 0.12, "sawtooth", 0.065, 620, 0.15);
          this.playTone(988, 0.16, "sawtooth", 0.065, 660, 0.30);
        },
        sfxBossAlarm() {
          for (let i = 0; i < 4; i++) {
            this.playTone(220 + (i % 2) * 110, 0.14, "sawtooth", 0.08, 160, i * 0.15);
            this.playNoise(0.08, 0.045, 800, i * 0.15);
          }
        },
        sfxBossHit() {
          this.playNoise(0.22, 0.085, 450);
          this.playTone(190, 0.22, "sawtooth", 0.085, 55);
          this.playTone(523.25, 0.10, "square", 0.065, 1046.5, 0.06);
        },
        sfxBossAttack() {
          this.playTone(660, 0.12, "sawtooth", 0.065, 220);
          this.playTone(440, 0.14, "square", 0.055, 180, 0.10);
        },
        sfxPointLoss() { this.playTone(250, 0.09, "sawtooth", 0.048, 175); },
        sfxAvatarSwap() {
          this.playTone(523.25, 0.05, "triangle", 0.07, 783.99);
          this.playTone(783.99, 0.07, "square", 0.038, 1046.5, 0.05);
        },
        sfxDayClear() {
          const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
          const times = [0, 0.08, 0.16, 0.24, 0.36, 0.44];
          const durs  = [0.07, 0.07, 0.07, 0.11, 0.07, 0.24];
          for (let i = 0; i < notes.length; i++) {
            this.playTone(notes[i], durs[i], "square", 0.065, null, times[i]);
            this.playTone(notes[i] * 0.5, durs[i], "triangle", 0.06, null, times[i]);
          }
        },
        sfxVictory() {
          const notes = [523.25, 659.25, 783.99, 1046.5, 880, 1046.5, 1318.5];
          notes.forEach((n, i) => {
            this.playTone(n, i === 6 ? 0.35 : 0.1, "square", 0.07, null, i * 0.11);
            this.playTone(n * 0.5, i === 6 ? 0.35 : 0.1, "triangle", 0.06, null, i * 0.11);
          });
        },
        sfxBurnout() {
          [440, 392, 349.23, 261.63].forEach((n, i) => this.playTone(n, 0.22, "sawtooth", 0.06, n * 0.88, i * 0.18));
        },

        updateMusic(dt, urgent, isBoss) {
          if (!this.enabled || !this.ctx || this.ctx.state !== "running") return;
          const stepDur = isBoss ? 0.095 : (urgent ? 0.105 : 0.135);
          this.musicTimer += dt;
          if (this.musicTimer < stepDur) return;
          this.musicTimer -= stepDur;

          const step = this.musicStep % 16;
          if (isBoss) {
            const bass = [146.83, 146.83, 174.61, 146.83, 130.81, 130.81, 164.81, 146.83, 146.83, 146.83, 220, 196, 174.61, 164.81, 146.83, 130.81];
            const lead = [587.33, 0, 698.46, 659.25, 587.33, 0, 523.25, 587.33, 880, 0, 783.99, 698.46, 659.25, 587.33, 523.25, 0];
            this.playTone(bass[step], stepDur * 0.85, "sawtooth", 0.038);
            if (lead[step] > 0) this.playTone(lead[step], stepDur * 0.8, "square", 0.024);
            if (step % 2 === 1) this.playNoise(0.025, 0.02, 3800);
          } else {
            const bass = [130.81, 0, 130.81, 164.81, 196, 0, 164.81, 0, 146.83, 0, 146.83, 174.61, 196, 0, 146.83, 164.81];
            const lead = [523.25, 0, 659.25, 0, 783.99, 659.25, 587.33, 523.25, 587.33, 0, 698.46, 0, 783.99, 880, 783.99, 659.25];
            if (bass[step] > 0) this.playTone(bass[step], stepDur * 0.85, "triangle", 0.04);
            if (lead[step] > 0) this.playTone(lead[step], stepDur * 0.75, "square", 0.02);
            if (step % 4 === 2) this.playNoise(0.024, 0.014, 4600);
          }
          this.musicStep++;
        }
      };

      /* ============================================================
         4. HAPTICS ENGINE (GESTURE-GATED WITH COOLDOWNS)
         ============================================================ */
      const Haptics = {
        enabled: true,
        userInteracted: false,
        lastBuzz: { small: 0, medium: 0, large: 0 },

        trigger(kind) {
          if (!this.enabled || !this.userInteracted) return;
          if (typeof navigator === "undefined" || typeof navigator.vibrate !== "function") return;
          const now = performance.now();
          const cooldowns = { small: 120, medium: 220, large: 480 };
          if (now - this.lastBuzz[kind] < cooldowns[kind]) return;
          this.lastBuzz[kind] = now;
          try {
            if (kind === "large") navigator.vibrate([75, 35, 115]);
            else if (kind === "medium") navigator.vibrate([32, 18, 42]);
            else navigator.vibrate(14);
          } catch (_) {}
        }
      };

      /* ============================================================
         5. GAME STATE
         ============================================================ */
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const canvasWrap = document.getElementById("canvas-wrap");

      let cardUid = 1;

      const State = {
        score: 0,
        highScore: 0,
        dayIndex: 0,
        dayDelivered: 0,
        totalDelivered: 0,
        morale: 5,
        maxMorale: 5,
        flowStreak: 1,
        maxStreakReached: 1,
        boilPenaltiesTaken: 0,

        mode: "playing", // "playing" | "victory" | "burnout"
        endScreenIdleTimer: 0,

        boss: {
          active: false,
          hp: 5,
          maxHp: 5,
          hitFlash: 0,
          attackTimer: 8.0,
          spawnTimer: 2.0,
          heatWaveTimer: 0
        },

        attractMode: true,
        inactivityTimer: 0,
        inactivityLimit: 15.0,

        cards: [],
        doneGhosts: [],
        particles: [],
        popups: [],

        time: 0,
        hitStop: 0,
        screenShake: 0,
        spawnTimer: 1.5,
        disruptionTimer: 11.0,
        cyberTimer: 25.0,
        bottleneckCritical: false,
        bottleneckDrainTimer: 0,
        banner: { active: false, title: "", sub: "", color: PAL.cyan, timer: 0, duration: 2.4 },

        colModifiers: {},

        stakeholder: {

          line2: "",

        },

        pointer: { x: LOGICAL_W * 0.5, y: LOGICAL_H * 0.5, down: false, invalidTimer: 0 },
        draggedCard: null,
